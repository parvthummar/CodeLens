name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codelens
          POSTGRES_PASSWORD: codelens
          POSTGRES_DB: codelens
        ports:
          - 5432:5432
        # The job runs on the host, not in the compose network, so the service
        # must be healthy before the first step or the connection races startup.
        options: >-
          --health-cmd "pg_isready -U codelens -d codelens"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # No PgBouncer here, so both URLs are the same endpoint. Neither is a
      # secret: this database exists for the length of one job.
      DATABASE_URL: postgresql://codelens:codelens@localhost:5432/codelens
      DATABASE_URL_DIRECT: postgresql://codelens:codelens@localhost:5432/codelens
      JWT_SECRET: ci-only-not-a-real-secret
      # Left empty on purpose. conftest makes the OpenAI and Pinecone clients
      # raise, so a test that forgets to stub one fails loudly instead of
      # reaching a paid API — and there are no keys here for it to reach with.
      OPENAI_API_KEY: ""
      PINECONE_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile and the local cr_venv.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # oxlint exits 0 on warnings, which would make this step unfailable. The
      # cap is a ratchet: 5 warnings exist today (unused imports, a hook
      # dependency, two fast-refresh notes), and a 6th fails the build. Lower
      # it as they get fixed.
      - name: Lint
        run: npm run lint -- --max-warnings 5

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # compose reads backend/.env, which is never committed. The template is
      # enough to parse the file and build; nothing here is started.
      - name: Provide an env file
        run: cp backend/.env.example backend/.env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

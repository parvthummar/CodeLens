[pytest]
testpaths = tests
asyncio_mode = auto
# Tests AND fixtures must share one event loop. asyncpg connections are bound to
# the loop that created them, so a session-scoped engine used from a
# function-scoped test loop fails with "another operation is in progress".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
markers =
    db: needs a live Postgres (uses DATABASE_URL_DIRECT). Deselect with -m "not db".
